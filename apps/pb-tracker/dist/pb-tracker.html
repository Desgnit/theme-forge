<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyrox Tracker</title>
<meta name="description" content="Log your times, watts and lifts, see every personal best, medal your top three efforts and score your overall fitness. Works offline on your phone.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hyrox Tracker">
<style>
/* Client PB Tracker — one stylesheet, no framework.
   Built phone-first: single column, thumb-reachable tab bar, 44px+ targets.
   Desktop is the same layout centred and given more air. */

:root {
  /* the app commits to one dark world, matching the printed tracker — telling
     the browser so keeps date pickers, scrollbars and file inputs in step */
  color-scheme: dark;

  --bg: #000;
  --panel: #0d0d0f;
  --panel-2: #141417;
  --line: #26262b;
  --line-soft: #1b1b1f;
  --text: #f4f4f5;
  --muted: #8b8b93;
  --accent: #f5c542;
  --accent-dim: #7a6320;
  --gold: #d9b032;
  --silver: #b9bcc2;
  --bronze: #b07a42;
  --good: #6dd48a;
  --bad: #ef6b6b;
  --radius: 12px;
  --tabbar: calc(58px + env(safe-area-inset-bottom));
  --sans: "Helvetica Neue", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }

/* An author display rule silently beats the UA's [hidden] — never let it. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 60;
  background: var(--accent); color: #000; padding: 10px 14px; border-radius: 0 0 8px 0;
}
.skip:focus { left: 0; }

/* ------------------------------------------------------------------ header */

.app-head {
  position: sticky; top: 0; z-index: 30;
  background: rgba(0, 0, 0, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.head-inner {
  display: flex; align-items: center; gap: 12px;
  max-width: 780px; margin: 0 auto; padding: 10px 16px;
}
.head-titles { flex: 1; min-width: 0; }
.head-kicker {
  display: block; font-size: 9px; letter-spacing: .32em; text-transform: uppercase;
  color: var(--muted);
}
.head-name {
  display: block; font-size: 17px; font-weight: 800; letter-spacing: .04em;
  text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-score {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 52px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel);
}
.head-score strong { font-size: 18px; line-height: 1; color: var(--accent); }
.head-score span { font-size: 8px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.head-gear {
  display: grid; place-items: center; width: 40px; height: 40px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
}
.head-gear svg { width: 19px; height: 19px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }

/* ------------------------------------------------------------------- layout */

.view {
  max-width: 780px; margin: 0 auto;
  padding: 16px 16px calc(var(--tabbar) + 28px);
  outline: none;
}

.screen-head { margin: 4px 0 18px; }
.screen-head h1 {
  margin: 0; font-size: 26px; line-height: 1.1; font-weight: 800;
  letter-spacing: .01em; text-transform: uppercase;
}
.screen-head .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.back {
  display: inline-block; margin-bottom: 10px; font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.back::before { content: "‹ "; }

.block { margin: 0 0 22px; }
.block-head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px; padding: 0 0 8px;
  border-bottom: 1px solid var(--line);
  font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
}
.block-head .num { color: var(--muted); }
.block-head em { color: var(--muted); font-style: normal; letter-spacing: .1em; }

.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.big-icon { width: 40px; height: 40px; }

.card {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 14px; margin: 0 0 14px;
}
.card-head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px; font-size: 12px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.card-head .count, .card-head .sec-score { margin-left: auto; color: var(--text); }
.card-head .sec-score { font-size: 18px; color: var(--accent); letter-spacing: 0; }

.body { margin: 0 0 10px; font-size: 14px; color: #cfcfd4; }
.fine { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.empty-card { text-align: center; padding: 28px 16px; }
.empty-card p { color: var(--muted); }

/* ---------------------------------------------------------------- welcome */

.welcome { display: grid; justify-items: center; text-align: center; padding-top: 18px; }
.art-welcome { width: 96px; height: 96px; margin-bottom: 6px; }
.welcome-title {
  margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase;
}
.welcome-sub { margin: 8px 0 20px; max-width: 30em; color: var(--muted); font-size: 14px; }
.welcome-card { width: 100%; text-align: left; }
.welcome .btn-ghost { margin-top: 4px; }
.welcome .fine { max-width: 34em; }

.head-signin {
  display: grid; place-items: center; width: auto; padding: 0 13px;
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: #100d00; background: var(--accent); border-color: var(--accent);
}

/* ---------------------------------------------------- video + race standards */

.video-link {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 10px; padding: 8px 13px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  font-size: 13px; font-weight: 600;
}
.video-link:active { background: var(--panel-2); }
.video-play {
  display: grid; place-items: center; width: 22px; height: 22px; flex: none;
  background: var(--accent); color: #100d00; border-radius: 50%; font-size: 10px;
  padding-left: 2px;
}
.video-by { color: var(--muted); font-weight: 400; font-size: 12px; }
.setup-line {
  margin: 10px 0 14px; padding: 9px 12px; font-size: 12.5px; color: var(--muted);
  background: var(--panel); border-left: 3px solid var(--line); border-radius: 0 8px 8px 0;
}
.race-line + .setup-line, .race-line + .levels-line + .setup-line { margin-top: -6px; }

.race-line {
  margin: 10px 0 14px; padding: 9px 12px; font-size: 12.5px; color: #cfcfd4;
  background: var(--panel); border-left: 3px solid var(--accent-dim); border-radius: 0 8px 8px 0;
}
.standards-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.standards-list li { display: grid; gap: 1px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.standards-list li:last-child { border-bottom: 0; }
.standards-list strong { font-size: 13px; }
.standards-list span { font-size: 12px; color: var(--muted); }

/* -------------------------------------------------------------- paste link */

.paste-link { margin-top: 10px; border: 1px dashed var(--line); border-radius: 10px; padding: 4px 12px 0; }
.paste-link[open] { padding-bottom: 12px; }
.paste-link summary {
  cursor: pointer; padding: 9px 0; font-size: 13px; color: var(--accent);
  list-style-position: inside;
}
.paste-link .field { margin: 8px 0 10px; }

/* -------------------------------------------------------------------- race */

.race-hero { display: grid; gap: 2px; text-align: center; }
.race-total { font-size: 44px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.race-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.race-rows li {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft);
}
.race-rows li:last-child { border-bottom: 0; }
.race-name { display: grid; font-size: 13px; font-weight: 600; min-width: 0; }
.race-src { font-style: normal; font-size: 11px; color: var(--muted); }
.race-src.own { color: var(--good); }
.race-time { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.race-budget { color: var(--accent); }
.rest-row { grid-template-columns: repeat(3, 1fr); }

/* ------------------------------------------------------------------- timer */

.timer-card { text-align: center; }
.timer-kind { margin-left: auto; font-size: 10px; letter-spacing: .12em; color: var(--accent); }
.timer-display {
  font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: .01em;
  font-variant-numeric: tabular-nums; margin: 4px 0 2px;
}
.timer-note { margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
.timer-card .btn-row { margin-top: 0; }

/* ------------------------------------------------------------------ levels */

.levels-line {
  margin: 8px 0 14px; font-size: 12.5px; color: var(--muted);
  letter-spacing: .01em;
}
.levels-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.levels-list li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
}
.levels-list li.here { background: rgba(245, 197, 66, .09); border: 1px solid var(--accent-dim); }
.lvl-name { font-size: 13px; font-weight: 600; }
.lvl-val { margin-left: auto; font-size: 15px; font-weight: 700; }
.lvl-you {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 999px; padding: 2px 8px;
}

/* ------------------------------------------------------------ baseline card */

.baseline-card { border-color: var(--accent-dim); }
.base-rows { display: grid; gap: 6px; }
.base-row {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--panel-2); border-radius: 10px;
}
.base-tick {
  display: grid; place-items: center; width: 22px; height: 22px;
  border: 1px solid var(--line); border-radius: 50%;
  font-size: 13px; color: #0f0c02;
}
.base-row.done .base-tick { background: var(--good); border-color: var(--good); }
.base-name { font-size: 14px; font-weight: 600; }
.base-val { font-size: 13px; color: var(--accent); }
.base-row.done .base-val { color: var(--muted); }

/* --------------------------------------------------------------- log tiles */

.art { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.art circle { fill: var(--accent); stroke: none; }
.art-tile { width: 38px; height: 38px; }
.art-form { width: 72px; height: 72px; flex: none; opacity: .95; }
.head-with-art { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.head-with-art h1 { margin: 0; }

.tiles { display: grid; gap: 8px; }
.tile {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: 2px 12px; padding: 11px 14px; min-height: 60px;
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
}
.tile:active { background: var(--panel-2); }
.tile .art-tile { grid-row: 1 / span 2; }
.tile-name { font-weight: 600; font-size: 15px; }
.tile-pb { grid-column: 2; font-size: 12px; color: var(--muted); }
.tile-go {
  grid-row: 1 / span 2; grid-column: 3;
  display: grid; place-items: center; width: 34px; height: 34px;
  border: 1px solid var(--accent-dim); border-radius: 50%;
  color: var(--accent); font-size: 20px; line-height: 1;
}

/* ------------------------------------------------------------------- forms */

.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field-label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field-label .opt { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .7; }
.field-input { position: relative; display: block; }
.field-input input {
  width: 100%; padding: 13px 14px; font-size: 17px;
  color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 10px;
}
.field-input input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.field-input .unit {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--muted); pointer-events: none;
}
/* Minutes : seconds pair — two boxes with a printed colon, so a phone
   keypad never has to produce punctuation. */
.t-wrap { display: flex; align-items: center; gap: 8px; }
.field-input .t-wrap input { width: 50%; min-width: 0; text-align: center; }
.t-colon { font-size: 20px; font-weight: 700; color: var(--muted); }
.split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-tight .field-input input { padding: 11px 12px; font-size: 16px; }
.field-tight .hint { min-height: 0; }
.hint { font-size: 12px; color: var(--muted); min-height: 16px; }
.hint.good { color: var(--good); }
.hint.bad { color: var(--bad); }
.derived {
  margin: -4px 0 0; padding: 10px 12px; font-size: 13px; color: var(--accent);
  background: rgba(245, 197, 66, .07); border: 1px dashed var(--accent-dim); border-radius: 10px;
}
.form-error { margin: 0; padding: 10px 12px; font-size: 14px; color: #fff; background: #521f1f; border-radius: 10px; }

.btn {
  display: block; width: 100%; padding: 14px 16px; margin: 0;
  font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  text-align: center; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.btn + .btn { margin-top: 8px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #100d00; }
.btn-ghost { background: transparent; }
.btn-danger { background: #451919; border-color: #6d2a2a; color: #ffd9d9; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn-row .btn + .btn { margin-top: 0; }
.icon-btn {
  display: grid; place-items: center; width: 32px; height: 32px; flex: none;
  color: var(--muted); background: transparent; border: 1px solid var(--line-soft);
  border-radius: 8px; cursor: pointer; font-size: 13px;
}
.hist-row .icon-btn:first-of-type, .sess-head .icon-btn { margin-left: auto; }
.hist-row .icon-btn + .icon-btn { margin-left: 6px; }
.icon-btn:hover { color: var(--text); border-color: var(--line); }
.icon-btn[data-delete]:hover, #edit-delete:hover { color: var(--bad); border-color: var(--bad); }
input[type="file"] { width: 100%; font-size: 13px; color: var(--muted); }

.note-card { display: grid; gap: 2px; }
.label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.big { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }

/* --------------------------------------------------------------- PB rows */

.rows { display: grid; gap: 6px; }
.row {
  display: grid; grid-template-columns: 1fr auto auto 12px; align-items: center; gap: 10px;
  padding: 12px 14px; min-height: 58px;
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
}
.row:active { background: var(--panel-2); }
.row-main { min-width: 0; }
.row-name { display: block; font-size: 14px; font-weight: 600; }
.row-name .tag {
  font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; vertical-align: 2px;
}
.row-meta { display: block; font-size: 12px; color: var(--muted); }
.row-val { font-size: 16px; font-weight: 700; white-space: nowrap; }
.row-arrow { color: var(--muted); }
.spark { width: 52px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.6; opacity: .75; }

/* --------------------------------------------------------- activity detail */

.hero-stat { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-stat > div:first-child { display: grid; gap: 2px; }
.score-chip {
  display: grid; place-items: center; gap: 2px; padding: 10px 12px; min-width: 88px;
  border: 1px solid var(--line); border-radius: 10px; text-align: center;
}
.score-chip strong { font-size: 22px; line-height: 1; }
.score-chip span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted-chip strong { color: var(--muted); }

.improve { margin: -6px 0 14px; font-size: 13px; }
.improve.up { color: var(--good); }
.improve.down { color: var(--bad); }

.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line-soft); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 8px; font-family: var(--sans); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: #000; stroke: var(--accent); stroke-width: 2; }
.chart .dot-best { fill: var(--gold); stroke: var(--gold); }
.chart .best-label { fill: var(--gold); font-size: 9px; font-weight: 700; font-family: var(--sans); }
.chart-caption { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.chart-empty { margin: 6px 0; font-size: 14px; color: var(--muted); }

.medal {
  display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none;
  border-radius: 50%; font-size: 11px; font-weight: 800; color: #14100a;
  border: 1px solid transparent;
}
.medal.m1 { background: var(--gold); }
.medal.m2 { background: var(--silver); }
.medal.m3 { background: var(--bronze); color: #1a0f06; }
.medal.blank { background: transparent; border-color: var(--line-soft); }

.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.podium-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--panel-2); border-radius: 10px;
}
.podium-val { font-size: 16px; font-weight: 700; }
.podium-date { margin-left: auto; font-size: 12px; color: var(--muted); }

.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.hist-row:last-child { border-bottom: 0; }
.hist-main { display: grid; min-width: 0; }
.hist-main strong { font-size: 15px; }
.hist-main .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------------ score */

.score-hero { display: flex; align-items: center; gap: 16px; }
.ring { width: 104px; height: 104px; flex: none; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; }
.score-hero-body { display: grid; gap: 2px; min-width: 0; }
.score-num { font-size: 42px; font-weight: 800; line-height: 1; }
.score-of { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.band {
  justify-self: start; margin: 4px 0 2px; padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0c0c0c;
}
.band-elite, .sr-score.band-elite { background: var(--accent); }
.band-advanced, .sr-score.band-advanced { background: #9fd8a8; }
.band-strong, .sr-score.band-strong { background: #8fb6d8; }
.band-developing, .sr-score.band-developing { background: #b7b7bd; }
.band-foundation, .sr-score.band-foundation { background: #6e6e76; color: #fff; }
.score-chip.band-elite, .score-chip.band-advanced, .score-chip.band-strong,
.score-chip.band-developing, .score-chip.band-foundation { color: #0c0c0c; }
.score-chip.band-elite span, .score-chip.band-advanced span, .score-chip.band-strong span,
.score-chip.band-developing span, .score-chip.band-foundation span { color: rgba(0, 0, 0, .65); }

.bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.score-rows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 1px; }
.score-rows a {
  display: grid; grid-template-columns: 1fr auto 34px; align-items: center; gap: 10px;
  padding: 9px 0; border-top: 1px solid var(--line-soft);
}
.sr-name { font-size: 13px; min-width: 0; }
.sr-val { font-size: 13px; color: var(--muted); white-space: nowrap; }
.sr-score {
  display: grid; place-items: center; height: 24px; border-radius: 6px;
  font-size: 12px; font-weight: 800; color: #0c0c0c;
}
.sr-score.band-none { background: var(--panel-2); color: var(--muted); }

.nudges { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; color: #cfcfd4; }
.nudge-tag {
  display: inline-block; margin-right: 8px; padding: 2px 7px; border-radius: 5px;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-soft);
}

/* ---------------------------------------------------------------- history */

.sess-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sess-head strong { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.sess-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sess-rows li { display: flex; align-items: center; gap: 10px; }
.sess-name { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-val { font-size: 14px; font-weight: 700; white-space: nowrap; }
.sess-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); font-style: italic; }

.linkish {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit;
}
.danger { border-color: #4a2222; }

/* ------------------------------------------------------------------ toast */

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar) + 12px); z-index: 50;
  display: flex; align-items: center; gap: 10px;
  width: min(92vw, 420px); padding: 12px 14px;
  background: #17171b; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .6);
  transform: translate(-50%, 26px); opacity: 0; pointer-events: none;
  transition: transform .22s ease, opacity .22s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.pb { border-color: var(--gold); background: #1d1706; }
.toast strong { display: block; font-size: 14px; }
.toast span { display: block; font-size: 12px; color: var(--muted); }
.toast .icon { width: 24px; height: 24px; stroke: var(--gold); }

/* --------------------------------------------------------------- tab bar */

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(6, 6, 8, .96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  display: grid; place-items: center; gap: 3px; padding: 9px 0 8px;
  color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }

/* ---------------------------------------------------------------- desktop */

@media (min-width: 720px) {
  .view { padding: 26px 24px 60px; }
  .split-grid { grid-template-columns: repeat(3, 1fr); }
  .screen-head h1 { font-size: 32px; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tabs {
    position: sticky; top: 0; bottom: auto;
    grid-template-columns: repeat(4, auto); justify-content: center; gap: 8px;
    border-top: 0; border-bottom: 1px solid var(--line); order: -1;
  }
  .tab { grid-auto-flow: column; padding: 10px 22px; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .app-head { order: -2; }
  .view { order: 0; padding-bottom: 60px; }
  .toast { bottom: 24px; }
  :root { --tabbar: 0px; }
}

/* Wide screens get two columns rather than one very long scroll. */
@media (min-width: 1000px) {
  .view { max-width: 1020px; }
  .rows, .tiles { grid-template-columns: 1fr 1fr; }
  .sec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .sec-grid .card { margin: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}

/* Value parsing and display. Times are stored as seconds throughout, so a
 * 2km row and a dead hang share one comparison path. */

   * Returns null when the text is not a usable value. */

     * "9.09" means 9:09. Two digits after the dot, reading as valid
     * seconds — a genuine decimal like "45.5" still means seconds. */

    var s = t % 60;
    var frac = Math.round((s - Math.floor(s)) * 10);
    var ss = String(Math.floor(s));

 * the overall score averages the sections that have any data — so the five

   * "next band at") follows automatically because it all comes through here. */

  /* One point per day you logged on, each showing the score you held that day. */
  function history() {
    var all = PB.store.load().entries.slice()
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var days = [];
    all.forEach(function (e) { if (days[days.length - 1] !== e.date) days.push(e.date); });
    var out = [];
    days.forEach(function (day) {
      var upTo = all.filter(function (e) { return e.date <= day; });
      var v = overallFor(upTo);
      if (v != null) out.push({ date: day, value: v });
    });
    return out;
  }

  function metricScore(metricId) {
    var metric = PB.metric(metricId);
    if (!metric.scored) return null;
    var b = PB.store.best(metricId);
    if (!b) return { metric: metric, logged: false, score: null };
    var s = scoreValue(metric, b.value);
    return { metric: metric, logged: true, best: b, score: s, band: band(s) };
  }

  function sectionScore(sectionId) {
    var rows = PB.metricsIn(sectionId)
      .filter(function (m) { return m.scored; })
      .map(function (m) { return metricScore(m.id); });
    var done = rows.filter(function (r) { return r.logged; });
    var score = done.length
      ? Math.round(done.reduce(function (a, r) { return a + r.score; }, 0) / done.length)
      : null;
    return {
      section: PB.section(sectionId), rows: rows, logged: done.length,
      total: rows.length, score: score, band: score == null ? null : band(score)
    };
  }

  function overall() {
    var sections = PB.SECTIONS.map(function (s) { return sectionScore(s.id); });
    var done = sections.filter(function (s) { return s.score != null; });
    var score = done.length
      ? Math.round(done.reduce(function (a, s) { return a + s.score; }, 0) / done.length)
      : null;
    var logged = sections.reduce(function (a, s) { return a + s.logged; }, 0);
    var total = sections.reduce(function (a, s) { return a + s.total; }, 0);
    return {
      score: score, band: score == null ? null : band(score),
      sections: sections, logged: logged, total: total,
      complete: logged === total
    };
  }

  /* Change between the first and the best effort, as a signed percentage. */
  function improvement(metricId) {
    var all = PB.store.entriesFor(metricId);
    if (all.length < 2) return null;
    var first = all[0].value;
    var b = PB.store.best(metricId);
    if (!first || !b) return null;
    var metric = PB.metric(metricId);
    var delta = metric.better === "lower" ? (first - b.value) / first : (b.value - first) / first;
    return Math.round(delta * 1000) / 10;
  }

  /* The single biggest score gain available right now — used to nudge the
   * next session towards whatever is holding the overall number down. */
  function weakestLogged() {
    var rows = PB.METRICS.filter(function (m) { return m.scored; })
      .map(function (m) { return metricScore(m.id); })
      .filter(function (r) { return r.logged; })
      .sort(function (a, b) { return a.score - b.score; });
    return rows[0] || null;
  }

  function nextUnlogged() {
    var rows = PB.METRICS.filter(function (m) { return m.scored; })
      .map(function (m) { return metricScore(m.id); })
      .filter(function (r) { return !r.logged; });
    return rows[0] || null;
  }

  /* Beginner / Average / Elite marks for one activity, read straight off the
   * same 0-100 scale the score uses, so this card and the score can never
   * disagree. Values are rounded to what someone would actually say out
   * loud: times to 5 seconds, kilos to 2.5, watts to 5. */
  var LEVELS = [["Beginner", 20], ["Average", 50], ["Elite", 90]];

  function roundLevel(metric, v) {
    if (PB.isTime(metric.unit)) return Math.round(v / 5) * 5;
    if (metric.unit === "kg") return Math.round(v / 2.5) * 2.5;
    if (metric.unit === "watts") return Math.round(v / 5) * 5;
    return Math.round(v);
  }

  function levels(metricId) {
    var metric = PB.metric(metricId);
    if (!metric.scored) return null;
    var ms = metricScore(metricId);
    var rows = LEVELS.map(function (lv) {
      return { name: lv[0], at: lv[1], value: roundLevel(metric, valueForScore(metric, lv[1])) };
    });
    if (ms && ms.logged) {
      var nearest = rows.reduce(function (a, r) {
        return Math.abs(r.at - ms.score) < Math.abs(a.at - ms.score) ? r : a;
      }, rows[0]);
      nearest.here = true;
    }
    return rows;
  }

  PB.score = {
    BANDS: BANDS, band: band, scoreValue: scoreValue, valueForScore: valueForScore,
    levels: levels,
    metricScore: metricScore, sectionScore: sectionScore, overall: overall,
    overallFor: overallFor, history: history,
    improvement: improvement, weakestLogged: weakestLogged, nextUnlogged: nextUnlogged
  };
})(window.PB = window.PB || {});

<script>
/* Cloud sync against a Supabase project.
 *
 * Plain fetch against Supabase's REST and auth endpoints — no SDK, so the
 * app stays a handful of small files with nothing to build. The app remains
 * local-first: every screen reads localStorage, and this file reconciles
 * that store with the `entries` table when it can. Offline it simply stays
 * quiet and catches up next time.
 *
 * Reconciliation: rows carry the writing device's `updated` stamp and the
 * newest write wins, on the server (a trigger discards stale updates) and
 * locally (applyRemote does the same), so sync order cannot resurrect a
 * deleted entry or undo a newer edit. Pulls are watermarked on the server's
 * own clock (server_updated), so a device with a wrong clock can lose a
 * conflict but can never be skipped over.
 *
 * Security lives in the database, not here: the anon key in this file's
 * config is public by design, and row-level security ties every row to the
 * signed-in user, with read-only access for a linked coach. See
 * supabase/schema.sql. */
(function (PB) {
  "use strict";

  var listeners = [];
  var timer = null;
  var busy = false;

  function st() { return PB.store.syncState(); }

  function emit() { listeners.forEach(function (fn) { fn(status()); }); }

  function config() {
    var s = st();
    return s.url && s.anonKey ? { url: s.url, anonKey: s.anonKey } : null;
  }

  function setConfig(url, anonKey) {
    url = String(url || "").trim().replace(/\/+$/, "");
    anonKey = String(anonKey || "").trim();
    if (!/^https:\/\/[\w.-]+$/.test(url)) throw new Error("That does not look like a project URL (https://xxxx.supabase.co).");
    if (anonKey.split(".").length !== 3) throw new Error("That does not look like an anon key.");
    PB.store.setSyncState({ url: url, anonKey: anonKey, optOut: false, lastError: null });
    emit();
  }

  function disconnect() {
    PB.store.setSyncState({
      optOut: true,
      url: null, anonKey: null, access: null, refresh: null, exp: null,
      userId: null, email: null, lastPull: null, lastPush: null, lastSync: null, lastError: null
    });
    emit();
  }

  function signedIn() {
    var s = st();
    return s.userId ? { userId: s.userId, email: s.email } : null;
  }

  /* --------------------------------------------------------------- fetch */

  function req(path, opts) {
    var c = config();
    if (!c) return Promise.reject(new Error("Sync is not set up yet."));
    opts = opts || {};
    var headers = { apikey: c.anonKey, "Content-Type": "application/json" };
    if (opts.auth !== false && st().access) headers.Authorization = "Bearer " + st().access;
    Object.keys(opts.headers || {}).forEach(function (k) { headers[k] = opts.headers[k]; });
    return fetch(c.url + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      if (res.status === 204) return null;
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON error body */ }
        if (!res.ok) {
          var msg = (data && (data.msg || data.message || data.error_description || data.hint)) ||
            ("The server said no (" + res.status + ").");
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* Runs a request with a fresh token, refreshing once if it is stale. */
  function authed(path, opts) {
    var s = st();
    if (!s.userId) return Promise.reject(new Error("Sign in first."));
    var stale = !s.exp || Date.now() / 1000 > s.exp - 60;
    var ready = stale ? refreshToken() : Promise.resolve();
    return ready.then(function () { return req(path, opts); }).then(null, function (err) {
      if (err && err.status === 401) {
        return refreshToken().then(function () { return req(path, opts); });
      }
      throw err;
    });
  }

  /* ---------------------------------------------------------------- auth */

  function jwtPayload(token) {
    try {
      var body = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      while (body.length % 4) body += "=";   // base64url drops padding; atob wants it back
      return JSON.parse(atob(body));
    } catch (e) { return {}; }
  }

  function keepSession(data) {
    var payload = jwtPayload(data.access_token);
    PB.store.setSyncState({
      access: data.access_token,
      refresh: data.refresh_token,
      exp: payload.exp || (Date.now() / 1000 + (data.expires_in || 3600)),
      userId: (data.user && data.user.id) || payload.sub,
      email: (data.user && data.user.email) || payload.email || "",
      lastError: null
    });
    emit();
  }

  function requestCode(email) {
    /* The redirect target must be explicit. Left out, the server falls back
     * to the requesting page's bare origin — which for an app served under a
     * path (GitHub Pages) is a dead page. Found the hard way. */
    var back = location.origin + location.pathname;
    return req("/auth/v1/otp?redirect_to=" + encodeURIComponent(back), {
      method: "POST", auth: false, body: { email: email, create_user: true }
    });
  }

  function verifyCode(email, code) {
    return req("/auth/v1/verify", {
      method: "POST", auth: false,
      body: { type: "email", email: email, token: String(code).trim() }
    }).then(function (data) {
      keepSession(data);
      return syncNow();
    });
  }

  /* Password sign-in: the everyday way in once a password exists. No email,
   * no hourly cap, nothing to redirect. The emailed link remains only for
   * the first-ever sign-in and for "forgot password". */
  function signInPassword(email, password) {
    return req("/auth/v1/token?grant_type=password", {
      method: "POST", auth: false,
      body: { email: String(email || "").trim(), password: password }
    }).then(function (data) {
      keepSession(data);
      return syncNow().then(null, function () { return null; });
    }, function (err) {
      if (err && err.status === 400) {
        err.message = "Email and password did not match. If you have not set a password yet, sign in with an emailed link first, then set one from the Data screen.";
      }
      throw err;
    });
  }

  /* Set (or change) the password on the signed-in account. */
  function setPassword(newPassword) {
    return authed("/auth/v1/user", {
      method: "PUT", body: { password: newPassword }
    });
  }

  /* The fallback for phones whose email app mangles the sign-in redirect:
   * paste the emailed link itself and the app exchanges its one-time token
   * directly with the server — no redirect anywhere in the chain. */
  function verifyPastedLink(text) {
    var s = String(text || "");

    /* A dead page reached AFTER a successful verify still carries the whole
     * session in its address — paste that URL and the session is adopted
     * directly, no server round-trip needed. */
    var at = s.match(/access_token=([A-Za-z0-9_.-]+)/);
    var rt = s.match(/refresh_token=([A-Za-z0-9_.-]+)/);
    if (at && rt) {
      var exp = s.match(/expires_in=(\d+)/);
      keepSession({ access_token: at[1], refresh_token: rt[1], expires_in: exp ? Number(exp[1]) : 3600 });
      if (!signedIn()) {
        return Promise.reject(new Error("Could not read a session from that address — email yourself a fresh link and paste that instead."));
      }
      // the session is in; a first sync hiccup must not undo the sign-in
      return syncNow().then(null, function () { return null; });
    }

    var m = s.match(/[?&#](?:token|token_hash)=([A-Za-z0-9_.-]+)/);
    if (!m) {
      return Promise.reject(new Error("That does not look like the sign-in link — long-press \"Sign in\" in the email and choose Copy link."));
    }
    return req("/auth/v1/verify", {
      method: "POST", auth: false,
      body: { type: "email", token_hash: m[1] }
    }).then(function (data) {
      keepSession(data);
      return syncNow();
    }, function (err) {
      if (err && /invalid or has expired/i.test(err.message || "")) {
        err.message = "That link has been used or has expired — email yourself a fresh one and paste that instead.";
      }
      throw err;
    });
  }

  /* A magic-link click lands back on the app with tokens in the URL hash.
   * Call before the router reads the hash. Returns true when it signed in. */
  function handleRedirect() {
    var h = location.hash || "";
    if (h.indexOf("error=") >= 0 && h.indexOf("access_token=") < 0) {
      // an expired link still lands here — explain instead of a blank stare
      PB.store.setSyncState({ lastError: "The sign-in link had already been used or expired. Email yourself a fresh one." });
      location.hash = config() && !signedIn() ? "#/welcome" : "#/log";
      return false;
    }
    if (h.indexOf("access_token=") < 0) return false;
    var params = {};
    h.replace(/^#\/?/, "").split("&").forEach(function (pair) {
      var kv = pair.split("=");
      params[kv[0]] = decodeURIComponent(kv[1] || "");
    });
    if (!params.access_token || !config()) return false;
    keepSession({ access_token: params.access_token, refresh_token: params.refresh_token, expires_in: params.expires_in });
    PB.store.setWelcomeDone(true);
    location.hash = "#/log";
    syncSoon();
    return true;
  }

  function refreshToken() {
    var s = st();
    if (!s.refresh) return Promise.reject(new Error("Signed out."));
    return req("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", auth: false, body: { refresh_token: s.refresh }
    }).then(keepSession, function (err) {
      if (err && (err.status === 400 || err.status === 401 || err.status === 403)) {
        PB.store.setSyncState({ access: null, refresh: null, exp: null, userId: null, email: null });
        emit();
        throw new Error("Your sign-in expired — sign in again.");
      }
      throw err;
    });
  }

  function signOut() {
    PB.store.setSyncState({
      access: null, refresh: null, exp: null, userId: null, email: null,
      lastPull: null, lastPush: null, lastSync: null, lastError: null
    });
    emit();
  }

  /* ---------------------------------------------------------------- sync */

  function pull() {
    var s = st();
    var q = "/rest/v1/entries?select=id,session,metric,value,date,note,updated,deleted,server_updated" +
      "&user_id=eq." + s.userId + "&order=server_updated.asc&limit=1000";
    if (s.lastPull) q += "&server_updated=gt." + encodeURIComponent(s.lastPull);
    return authed(q).then(function (rows) {
      rows = rows || [];
      var applied = PB.store.applyRemote(rows);
      if (rows.length) {
        PB.store.setSyncState({ lastPull: rows[rows.length - 1].server_updated });
      }
      // a full page means there is more where that came from
      return rows.length === 1000 ? pull().then(function (n) { return applied + n; }) : applied;
    });
  }

  function push() {
    var s = st();
    var rows = PB.store.changedSince(s.lastPush).map(function (e) {
      return {
        id: e.id, user_id: s.userId, session: e.session, metric: e.metric,
        value: e.value, date: e.date, note: e.note, updated: e.updated, deleted: e.deleted
      };
    });
    if (!rows.length) return Promise.resolve(0);
    var mark = new Date().toISOString();
    return authed("/rest/v1/entries", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: rows
    }).then(function () {
      PB.store.setSyncState({ lastPush: mark });
      return rows.length;
    });
  }

  function syncNow() {
    if (!config() || !signedIn()) return Promise.resolve(null);
    if (busy) return Promise.resolve(null);
    busy = true;
    emit();
    return pull().then(function (pulled) {
      return push().then(function (pushed) {
        PB.store.setSyncState({ lastSync: new Date().toISOString(), lastError: null });
        busy = false;
        emit();
        return { pulled: pulled, pushed: pushed };
      });
    }).then(null, function (err) {
      busy = false;
      PB.store.setSyncState({ lastError: err.message || "Sync failed." });
      emit();
      throw err;
    });
  }

  /* Batches the burst of saves a logging session makes into one sync. */
  function syncSoon() {
    if (!config() || !signedIn()) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      syncNow().then(null, function () { /* status already carries the error */ });
    }, 2500);
  }

  function status() {
    var s = st();
    return {
      configured: !!config(),
      signedIn: !!s.userId,
      email: s.email || "",
      busy: busy,
      lastSync: s.lastSync || null,
      pending: config() && s.userId ? PB.store.changedSince(s.lastPush).length : 0,
      lastError: s.lastError || null
    };
  }

  /* --------------------------------------------------------------- coach */

  function inviteCode() {
    var abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    var out = "";
    for (var i = 0; i < 8; i++) out += abc[Math.floor(Math.random() * abc.length)];
    return out.slice(0, 4) + "-" + out.slice(4);
  }

  /* The athlete mints a code; whoever redeems it becomes a read-only coach. */
  function createInvite() {
    var code = inviteCode();
    return authed("/rest/v1/coach_invites", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: { code: code, athlete_id: st().userId }
    }).then(function () { return code; });
  }

  function redeemInvite(code) {
    return authed("/rest/v1/rpc/redeem_coach_invite", {
      method: "POST",
      body: { invite_code: String(code).trim().toUpperCase() }
    });
  }

  function myCoaches() {
    return authed("/rest/v1/coach_links?select=coach_id&athlete_id=eq." + st().userId)
      .then(function (links) { return withNames(links || [], "coach_id"); });
  }

  function myAthletes() {
    return authed("/rest/v1/coach_links?select=athlete_id&coach_id=eq." + st().userId)
      .then(function (links) { return withNames(links || [], "athlete_id"); });
  }

  function withNames(links, key) {
    if (!links.length) return Promise.resolve([]);
    var ids = links.map(function (l) { return l[key]; });
    return authed("/rest/v1/profiles?select=id,name&id=in.(" + ids.join(",") + ")")
      .then(function (profiles) {
        var names = {};
        (profiles || []).forEach(function (p) { names[p.id] = p.name; });
        return ids.map(function (id) { return { id: id, name: names[id] || "Unnamed athlete" }; });
      });
  }

  function dropCoach(coachId) {
    return authed("/rest/v1/coach_links?coach_id=eq." + coachId + "&athlete_id=eq." + st().userId,
      { method: "DELETE", headers: { Prefer: "return=minimal" } });
  }

  function athleteEntries(athleteId) {
    return authed("/rest/v1/entries?select=metric,value,date,note,updated,deleted" +
      "&user_id=eq." + athleteId + "&deleted=eq.false&order=date.asc&limit=5000");
  }

  /* The signed-in user's display name, mirrored for coaches to see. */
  function pushProfile() {
    if (!config() || !signedIn()) return Promise.resolve();
    return authed("/rest/v1/profiles", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: { id: st().userId, name: PB.store.athlete().name || "" }
    });
  }

  /* The app ships wired to its own project (config.js), so a fresh device
   * needs no pasting — just the sign-in. An explicit disconnect is
   * remembered and never overridden. The claude.ai preview sandbox blocks
   * outside requests entirely, so there sync stays unconfigured. */
  (function adoptDefaults() {
    if (!PB.SYNC_DEFAULTS) return;
    if (window.claude && typeof window.claude.use === "function") return;
    var s = st();
    if (s.url || s.optOut) return;
    try { setConfig(PB.SYNC_DEFAULTS.url, PB.SYNC_DEFAULTS.anonKey); } catch (e) { /* stays manual */ }
  })();

  PB.sync = {
    config: config, setConfig: setConfig, disconnect: disconnect,
    signedIn: signedIn, requestCode: requestCode, verifyCode: verifyCode,
    verifyPastedLink: verifyPastedLink,
    signInPassword: signInPassword, setPassword: setPassword,
    handleRedirect: handleRedirect, signOut: signOut,
    syncNow: syncNow, syncSoon: syncSoon, status: status,
    onStatus: function (fn) { listeners.push(fn); },
    createInvite: createInvite, redeemInvite: redeemInvite,
    myCoaches: myCoaches, myAthletes: myAthletes, dropCoach: dropCoach,
    athleteEntries: athleteEntries, pushProfile: pushProfile
  };
})(window.PB = window.PB || {});

</script>
<script>
/* Dependency-free SVG progress chart.
 *
 * The y axis is flipped for time-based metrics, so on every graph in the app
 * "up and to the right" means you got better — no reading the axis twice. */
(function (PB) {
  "use strict";

  var W = 340, H = 170, PAD_L = 44, PAD_R = 10, PAD_T = 14, PAD_B = 26;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function niceTicks(min, max, count) {
    if (min === max) return [min];
    var step = (max - min) / (count - 1), out = [];
    for (var i = 0; i < count; i++) out.push(min + step * i);
    return out;
  }

  /* points: [{date, value}] oldest first. opts: {unit, betterUp, id, caption} */
  function draw(entries, opts) {
    var unit = opts.unit;
    var betterUp = opts.betterUp;
    var values = entries.map(function (e) { return e.value; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = max - min || Math.max(max * 0.1, 1);
    var lo = min - span * 0.18, hi = max + span * 0.18;

    var x = function (i) { return PAD_L + (i / (entries.length - 1)) * (W - PAD_L - PAD_R); };
    var y = function (v) {
      var t = (v - lo) / (hi - lo);            // 0 at lo, 1 at hi
      if (!betterUp) t = 1 - t;                 // flip so better is always higher
      return H - PAD_B - t * (H - PAD_T - PAD_B);
    };

    var pts = entries.map(function (e, i) { return [x(i), y(e.value)]; });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (H - PAD_B) +
      " L" + pts[0][0].toFixed(1) + " " + (H - PAD_B) + " Z";

    var bestValue = betterUp ? max : min;
    var bestIndex = values.indexOf(bestValue);
    var svg = ['<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
      esc(opts.label || "Progress chart") + '">'];

    svg.push('<defs><linearGradient id="cg-' + opts.id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.30"/>' +
      '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>');

    var timeAxis = PB.isTime(unit);
    var seen = {};
    niceTicks(lo, hi, 4).forEach(function (v) {
      var at = timeAxis && span > 20 ? Math.round(v) : v;   // whole seconds once the range is wide
      var label = PB.formatValue(unit, at);
      if (seen[label]) return;
      seen[label] = true;
      var yy = y(v).toFixed(1);
      svg.push('<line class="grid" x1="' + PAD_L + '" y1="' + yy + '" x2="' + (W - PAD_R) + '" y2="' + yy + '"/>');
      svg.push('<text class="axis" x="' + (PAD_L - 6) + '" y="' + (Number(yy) + 3.5) +
        '" text-anchor="end">' + esc(label) + "</text>");
    });

    svg.push('<path class="area" d="' + area + '" fill="url(#cg-' + opts.id + ')"/>');
    svg.push('<path class="line" d="' + line + '"/>');

    entries.forEach(function (e, i) {
      var isBest = i === bestIndex;
      svg.push('<circle class="dot' + (isBest ? " dot-best" : "") + '" cx="' + pts[i][0].toFixed(1) +
        '" cy="' + pts[i][1].toFixed(1) + '" r="' + (isBest ? 5 : 3.2) + '"><title>' +
        esc(PB.formatFull(unit, e.value) + " — " + PB.formatDate(e.date)) + "</title></circle>");
    });

    if (bestIndex >= 0) {
      var lx = Math.min(Math.max(pts[bestIndex][0], PAD_L + 18), W - PAD_R - 18);
      svg.push('<text class="best-label" x="' + lx.toFixed(1) + '" y="' +
        Math.max(pts[bestIndex][1] - 9, 10).toFixed(1) + '" text-anchor="middle">' +
        esc(PB.formatFull(unit, bestValue)) + "</text>");
    }

    svg.push('<text class="axis" x="' + PAD_L + '" y="' + (H - 8) + '">' + esc(PB.formatDate(entries[0].date)) + "</text>");
    svg.push('<text class="axis" x="' + (W - PAD_R) + '" y="' + (H - 8) + '" text-anchor="end">' +
      esc(PB.formatDate(entries[entries.length - 1].date)) + "</text>");
    svg.push("</svg>");

    var caption = opts.caption || (betterUp
      ? "Higher is better — the line rising means you are improving."
      : "Faster is better — the axis is flipped, so a rising line means quicker times.");
    return svg.join("") + '<p class="chart-caption">' + caption + "</p>";
  }

  function render(metricId) {
    var metric = PB.metric(metricId);
    var entries = PB.store.entriesFor(metricId);
    if (!entries.length) {
      return '<p class="chart-empty">No entries yet. Log this activity and your progress line starts here.</p>';
    }
    if (entries.length === 1) {
      return '<p class="chart-empty">One entry so far — <strong>' +
        esc(PB.formatFull(metric.unit, entries[0].value)) +
        "</strong>. Log it again to draw a progress line.</p>";
    }
    return draw(entries, {
      unit: metric.unit, betterUp: metric.better === "higher",
      id: metricId, label: "Progress chart for " + metric.name
    });
  }

  /* Tiny inline trend line for list rows. */
  function spark(metricId) {
    var entries = PB.store.entriesFor(metricId);
    if (entries.length < 2) return "";
    var metric = PB.metric(metricId);
    var vals = entries.map(function (e) { return e.value; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = max - min || 1;
    var betterUp = metric.better === "higher";
    var d = entries.map(function (e, i) {
      var t = (e.value - min) / range;
      if (!betterUp) t = 1 - t;
      var px = (i / (entries.length - 1)) * 52;
      var py = 16 - t * 13 - 1.5;
      return (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
    }).join(" ");
    return '<svg class="spark" viewBox="0 0 52 18" aria-hidden="true"><path d="' + d + '"/></svg>';
  }

  /* The overall fitness score plotted as it stood on each day you logged. */
  function scoreTrend() {
    var points = PB.score.history();
    if (points.length < 2) {
      return '<p class="chart-empty">Your score line starts once you have logged on two different days.</p>';
    }
    return draw(points, {
      unit: "score", betterUp: true, id: "score-trend",
      label: "Overall fitness score over time",
      caption: "Your overall score as it stood on each day you logged something."
    });
  }

  PB.chart = { render: render, spark: spark, scoreTrend: scoreTrend };
})(window.PB = window.PB || {});

</script>
<script>
/* Screens, routing and interaction. Hash routes keep the whole thing a single
 * static file set — no build step, no server, back button works. */
(function (PB) {
  "use strict";

  var view, toastEl;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var ICONS = {
    bike: '<circle cx="6" cy="17" r="4"/><circle cx="18" cy="17" r="4"/><path d="M6 17 10 8h5l3 9M9 8h6"/>',
    erg: '<path d="M3 18h7l4-6 3 2 4-6"/><circle cx="9" cy="7" r="2.4"/><path d="M6 12l4-3"/>',
    run: '<circle cx="15" cy="4.5" r="2.2"/><path d="M13 21l2-6-3-3 1-5 4 3 3 1M9 21l3-5M6 11l3-2"/>',
    strength: '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
    pulse: '<path d="M2 12h4l3-7 4 14 3-7h6"/>',
    scale: '<path d="M5 20h14M7 20v-3h10v3M12 4v13M8 7l4-3 4 3"/>',
    trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M10 18h4M9 21h6"/>'
  };

  function icon(name, cls) {
    return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true">' +
      (ICONS[name] || "") + "</svg>";
  }

  function medalBadge(pos) {
    if (!pos) return "";
    var label = ["", "1st", "2nd", "3rd"][pos];
    return '<span class="medal m' + pos + '" title="' + label + ' best">' + pos + "</span>";
  }

  function go(hash) { location.hash = hash; }

  /* Handing the viewer a file.
   *
   * Served as an ordinary page — GitHub Pages, a local server, the single-file
   * build — a blob link downloads it. Inside the claude.ai artifact viewer
   * that link is inert by design, and the host mediates saves instead, so ask
   * it and fall back only when it is not there. Either way the clipboard
   * button on the same screen is a second route out. */
  var downloadsReady = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("downloads").catch(function () { return null; })
    : Promise.resolve(null);

  function blobDownload(filename, text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function saveFile(filename, text) {
    downloadsReady.then(function (downloads) {
      if (!downloads) { blobDownload(filename, text); return; }
      downloads.save({ filename: filename, data: text }).then(function () {
        toast("<div><strong>Backup saved</strong><span>" + esc(filename) + "</span></div>");
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") return;
        if (code === "rate_limited") {
          toast("<div><strong>Try that again in a moment</strong><span>A save is already waiting</span></div>");
          return;
        }
        toast('<div><strong>Could not save the file here</strong>' +
          "<span>Use Copy to clipboard instead</span></div>");
      });
    });
  }

  function toast(html, kind) {
    toastEl.className = "toast show " + (kind || "");
    toastEl.innerHTML = html;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.className = "toast"; }, 4200);
  }

  /* ---------------------------------------------------------------- Log menu */

  /* Days from today to the plan start; negative once it has begun. */
  function daysToPlan() {
    var start = PB.store.athlete().planStart;
    if (!start) return null;
    return PB.dayDiff(PB.today(), start);
  }

  /* The card the coach's message asks for: get the key baselines logged
   * before the plan begins. Shown through test week and the first week. */
  function baselineCard() {
    var d = daysToPlan();
    if (d === null || d < -6) return "";
    var rows = PB.BASELINE.map(function (id) {
      var m = PB.metric(id);
      var b = PB.store.best(id);
      var formId = (PB.FORMS.filter(function (f) {
        return f.fields.some(function (x) { return x.metric === id; });
      })[0] || {}).id;
      return '<a class="base-row' + (b ? " done" : "") + '" href="#/log/' + formId + '">' +
        '<span class="base-tick">' + (b ? "✓" : "") + "</span>" +
        '<span class="base-name">' + esc(m.short) + "</span>" +
        '<span class="base-val">' + (b ? esc(PB.formatFull(m.unit, b.value)) : "log it") + "</span></a>";
    });
    var left = PB.BASELINE.filter(function (id) { return !PB.store.best(id); }).length;
    var when = d > 1 ? "Plan starts in " + d + " days"
      : d === 1 ? "Plan starts tomorrow"
        : d === 0 ? "The plan starts today"
          : "The plan has started";
    var line = left === 0 ? "All four baselines are in — ready to go."
      : when + " — " + (left === PB.BASELINE.length ? "get these baselines logged first." :
        left + " baseline" + (left === 1 ? "" : "s") + " still to log.");
    return '<section class="card baseline-card"><h2 class="card-head">' + icon("pulse") +
      'Baseline test week</h2><p class="body">' + esc(line) + "</p>" +
      '<div class="base-rows">' + rows.join("") + "</div>" +
      '<p class="fine">These four are what the coach wants before day one. Change the start date from the cog.</p></section>';
  }

  function viewLogMenu() {
    var html = ['<header class="screen-head"><h1>Log an activity</h1>' +
      '<p class="sub">Pick what you did. Two taps and you are done.</p></header>'];
    html.push(baselineCard());

    PB.SECTIONS.forEach(function (s) {
      var forms = PB.FORMS.filter(function (f) { return f.section === s.id; });
      html.push('<section class="block"><h2 class="block-head">' + icon(s.icon) +
        '<span class="num">' + s.n + ".</span> " + esc(s.name) +
        (s.sub ? ' <em>(' + esc(s.sub) + ")</em>" : "") + "</h2><div class=\"tiles\">");
      forms.forEach(function (f) {
        var primary = f.fields[0].metric;
        var b = PB.store.best(primary);
        html.push('<a class="tile" href="#/log/' + f.id + '">' +
          PB.art(f.art, "art-tile") +
          '<span class="tile-name">' + esc(f.title) + "</span>" +
          '<span class="tile-pb">' + (b ? (PB.metric(primary).neutral ? "Latest " : "PB ") + esc(PB.formatFull(PB.metric(primary).unit, b.value)) : "No entry yet") + "</span>" +
          '<span class="tile-go">+</span></a>');
      });
      html.push("</div></section>");
    });

    html.push('<section class="card standards"><h2 class="card-head">Hyrox race standards</h2>' +
      '<p class="body">The eight stations as they run on race day — same loads at every event, Manchester included. Open division first, pro in brackets.</p><ul class="standards-list">');
    PB.RACE_STANDARDS.forEach(function (row) {
      html.push('<li><strong>' + esc(row[0]) + "</strong><span>" + esc(row[1]) + "</span></li>");
    });
    html.push('</ul><p class="fine">1km of running between every station. Wall ball reps: 100 men open, 75 women open.</p></section>');
    return html.join("");
  }

  /* ------------------------------------------------------------------ Timer */

  /* Elapsed time is always computed from wall-clock timestamps, never by
   * counting ticks — a phone that throttles a background tab or dims the
   * screen still produces the right time. A screen wake lock is requested
   * while running, where the browser offers one. */
  var timer = { state: "idle", raf: 0, wakeLock: null, audio: null };

  function timerBeep(freq, dur) {
    try {
      timer.audio = timer.audio || new (window.AudioContext || window.webkitAudioContext)();
      var osc = timer.audio.createOscillator();
      var gain = timer.audio.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(timer.audio.destination);
      osc.start();
      osc.stop(timer.audio.currentTime + dur);
    } catch (e) { /* no sound is fine */ }
  }

  function timerBuzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* optional */ } }
  }

  function timerWake(on) {
    if (on && navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request("screen").then(function (l) { timer.wakeLock = l; }, function () {});
    } else if (!on && timer.wakeLock) {
      timer.wakeLock.release().catch(function () {});
      timer.wakeLock = null;
    }
  }

  function timerStopTicking() {
    cancelAnimationFrame(timer.raf);
    timer.state = "idle";
    timerWake(false);
  }

  function fillField(metricId, secs) {
    writeField(document, metricId, secs);
  }

  function timerCard(f) {
    if (!f.timer) return "";
    var cd = f.timer.mode === "countdown";
    var label = cd ? (f.timer.seconds >= 120 ? Math.round(f.timer.seconds / 60) + " minute countdown" : f.timer.seconds + "s countdown") : "stopwatch";
    return '<section class="card timer-card"><h2 class="card-head">Timer <span class="timer-kind">' + esc(label) + "</span></h2>" +
      '<div class="timer-display" id="timer-display">' + (cd ? esc(PB.formatTime(f.timer.seconds)) : "0:00.0") + "</div>" +
      '<p class="timer-note" id="timer-note">' +
      esc(cd ? "Start it, go all out until the beeps, then type your result below."
        : (f.timer.laps ? "Tap Lap as you pass each kilometre — the splits and total fill themselves in."
          : "Stop it and the time drops straight into the box below.")) + "</p>" +
      '<div class="btn-row"><button type="button" class="btn btn-primary" id="timer-main">Start</button>' +
      '<button type="button" class="btn" id="timer-side" hidden>Lap</button></div></section>';
  }

  function wireTimer(f) {
    if (!f.timer) return;
    var cd = f.timer.mode === "countdown";
    var display = document.getElementById("timer-display");
    var note = document.getElementById("timer-note");
    var main = document.getElementById("timer-main");
    var side = document.getElementById("timer-side");
    var startTs = 0, lastLapTs = 0, lapIndex = 0, lastWholeSecond = -1;

    function show(secs, tenths) {
      display.textContent = PB.formatTime(tenths ? Math.round(secs * 10) / 10 : Math.max(0, Math.ceil(secs)));
    }

    function tick() {
      if (timer.state !== "running") return;
      var elapsed = (Date.now() - startTs) / 1000;
      if (cd) {
        var left = f.timer.seconds - elapsed;
        // one cue per second boundary: short beeps into the finish, long one at zero
        var whole = Math.ceil(left);
        if (whole !== lastWholeSecond && whole <= 3 && whole >= 1) { timerBeep(880, 0.12); timerBuzz(60); }
        lastWholeSecond = whole;
        if (left <= 0) {
          timerStopTicking();
          timerBeep(1318, 0.7);
          timerBuzz([120, 80, 240]);
          display.textContent = "0:00";
          note.textContent = "Time! Type your result below.";
          main.textContent = "Start again";
          side.hidden = true;
          var first = document.querySelector("#entry-form input");
          if (first) first.focus();
          return;
        }
        show(left, left < 10);
      } else {
        show(elapsed, true);
      }
      timer.raf = requestAnimationFrame(tick);
    }

    function begin() {
      startTs = Date.now();
      lastLapTs = startTs;
      lapIndex = 0;
      lastWholeSecond = -1;
      timer.state = "running";
      timerWake(true);
      timerBeep(660, 0.15);
      main.textContent = cd ? "Cancel" : "Stop" + (f.timer.fill ? " & fill in" : "");
      if (f.timer.laps) {
        side.hidden = false;
        side.textContent = "Lap";
        note.textContent = "Lap 1 of " + f.timer.laps.length + " — tap Lap as you pass 1km.";
      }
      tick();
    }

    function finishStopwatch() {
      var elapsed = (Date.now() - startTs) / 1000;
      timerStopTicking();
      show(elapsed, true);
      if (f.timer.laps && lapIndex > 0 && lapIndex < f.timer.laps.length) {
        // stopped mid-run: the final stretch is the last split
        fillField(f.timer.laps[lapIndex], (Date.now() - lastLapTs) / 1000);
      }
      if (f.timer.fill) fillField(f.timer.fill, elapsed);
      note.textContent = "In the box. Check it, add the date, save.";
      main.textContent = "Start again";
      side.hidden = true;
      timerBuzz(150);
    }

    main.onclick = function () {
      if (timer.state === "running") {
        if (cd) {
          timerStopTicking();
          show(f.timer.seconds);
          note.textContent = "Cancelled — nothing recorded.";
          main.textContent = "Start";
        } else {
          finishStopwatch();
        }
      } else {
        if (cd) show(f.timer.seconds);
        begin();
      }
    };

    side.onclick = function () {
      if (timer.state !== "running" || !f.timer.laps) return;
      var now = Date.now();
      fillField(f.timer.laps[lapIndex], (now - lastLapTs) / 1000);
      lastLapTs = now;
      lapIndex++;
      timerBeep(880, 0.1);
      timerBuzz(60);
      if (lapIndex >= f.timer.laps.length) {
        finishStopwatch();
      } else {
        note.textContent = "Lap " + (lapIndex + 1) + " of " + f.timer.laps.length + " — split " + lapIndex + " is in.";
      }
    };
  }

  /* Rest timer for the strength forms: tap a preset after a set, lift again
   * when it beeps. Deliberately separate from the main timer so a running
   * rest clock and the entry form never fight over state. */
  var rest = { deadline: 0, raf: 0, secs: 0 };

  function restCard(f) {
    if (!f.rest) return "";
    return '<section class="card timer-card"><h2 class="card-head">Rest timer <span class="timer-kind">between sets</span></h2>' +
      '<div class="timer-display" id="rest-display">–</div>' +
      '<p class="timer-note" id="rest-note">After a set, tap how long to rest — it beeps when it is time to lift again.</p>' +
      '<div class="btn-row rest-row">' + f.rest.map(function (s) {
        return '<button type="button" class="btn" data-rest="' + s + '">' + PB.formatTime(s) + "</button>";
      }).join("") + "</div></section>";
  }

  function wireRest(f) {
    if (!f.rest) return;
    var display = document.getElementById("rest-display");
    var note = document.getElementById("rest-note");

    function stop() {
      cancelAnimationFrame(rest.raf);
      rest.deadline = 0;
      [].forEach.call(document.querySelectorAll("[data-rest]"), function (b) { b.classList.remove("btn-primary"); });
    }

    function tick() {
      if (!rest.deadline) return;
      var left = (rest.deadline - Date.now()) / 1000;
      if (left <= 0) {
        stop();
        display.textContent = "0:00";
        note.textContent = "Rest over — next set.";
        timerBeep(1318, 0.6);
        timerBuzz([120, 80, 240]);
        return;
      }
      display.textContent = PB.formatTime(Math.ceil(left));
      rest.raf = requestAnimationFrame(tick);
    }

    [].forEach.call(document.querySelectorAll("[data-rest]"), function (btn) {
      btn.onclick = function () {
        var secs = Number(btn.getAttribute("data-rest"));
        if (rest.deadline && rest.secs === secs) {   // tapping the running preset cancels it
          stop();
          display.textContent = "–";
          note.textContent = "Cancelled.";
          return;
        }
        stop();
        rest.secs = secs;
        rest.deadline = Date.now() + secs * 1000;
        btn.classList.add("btn-primary");
        note.textContent = "Resting — lift again at the beep.";
        timerBeep(660, 0.12);
        tick();
      };
    });
  }

  /* A one-tap "watch how it's done" link. Opens in the YouTube app or a new
   * tab — never inside the tracker, so a half-typed entry is not lost. */
  function videoLink(f) {
    if (!f || !f.video) return "";
    return '<a class="video-link" href="' + esc(f.video.url) + '" target="_blank" rel="noopener">' +
      '<span class="video-play">▶</span> How to do it — short video <span class="video-by">' +
      esc(f.video.by) + "</span></a>";
  }

  /* Times are typed like a stopwatch reads: a minutes box and a seconds box,
   * both plain digits — nothing to punctuate, nothing to misread. The pair
   * is joined back into "m:ss" wherever a value is read. */
  function timePairInputs(idAttr, nameAttr) {
    return '<span class="t-wrap">' +
      '<input id="' + idAttr + '" name="' + nameAttr + '" class="t-mm" type="text" ' +
      'inputmode="numeric" autocomplete="off" maxlength="2" placeholder="min">' +
      '<span class="t-colon">:</span>' +
      '<input id="' + idAttr + '__ss" name="' + nameAttr + '__ss" class="t-ss" type="text" ' +
      'inputmode="decimal" autocomplete="off" maxlength="4" placeholder="sec"></span>';
  }

  /* Combined "m:ss" text for a field, whether it is a time pair or a plain
   * input. Empty when both boxes are empty; single-digit seconds pad to two
   * so "9" means 9 seconds, not 90. */
  function readField(root, name) {
    var el = root.querySelector('[name="' + name + '"]');
    if (!el) return "";
    if (!el.classList.contains("t-mm")) return el.value.trim();
    var ss = root.querySelector('[name="' + name + '__ss"]');
    var mv = el.value.trim(), sv = ss ? ss.value.trim() : "";
    if (!mv && !sv) return "";
    /* seconds alone stay plain seconds — "75" in the seconds box is 1:15,
       not an error */
    if (!mv) return sv;
    if (/^\d$/.test(sv)) sv = "0" + sv;
    return mv + ":" + (sv || "00");
  }

  function writeField(root, name, secs, silent) {
    var el = root.querySelector('[name="' + name + '"]');
    if (!el) return;
    var t = PB.formatTime(Math.round(secs * 10) / 10);
    if (el.classList.contains("t-mm")) {
      var parts = t.split(":");
      el.value = parts.length === 3 ? String(Number(parts[0]) * 60 + Number(parts[1])) : parts[0];
      var ss = root.querySelector('[name="' + name + '__ss"]');
      if (ss) ss.value = parts[parts.length - 1];
    } else {
      el.value = t;
    }
    /* silent writes come from inside an input handler — dispatching there
       would re-enter it forever */
    if (!silent) el.dispatchEvent(new Event("input", { bubbles: true }));
  }

  /* ------------------------------------------------------------- Entry form */

          : '<input id="fi-' + fld.metric + '" name="' + fld.metric + '" type="text" ' +
            'inputmode="decimal" autocomplete="off" placeholder="0">') +

        "</span>" +
        '<span class="hint" data-hint="' + fld.metric + '">' + esc(inGrid ? "" : u.hint) + "</span></label>");
    });
    if (openedGrid) html.push("</div>");

    if (f.derive) {
      html.push('<p class="derived" id="derived-out">Pace per 500m fills in automatically.</p>');

    html.push('<label class="field"><span class="field-label">Date</span>' +
      '<span class="field-input"><input type="date" name="date" value="' + PB.today() + '" max="' + PB.today() + '"></span></label>');
    html.push('<label class="field"><span class="field-label">Note <em class="opt">optional</em></span>' +
      '<span class="field-input"><input type="text" name="note" maxlength="120" placeholder="How it felt, conditions, kit"></span></label>');

    html.push('<p class="form-error" id="form-error" hidden></p>');
    html.push('<button class="btn btn-primary" type="submit">Save entry</button>');
    html.push("</form>");

    var b = PB.store.best(primary);
    if (b) {
      html.push('<div class="card note-card"><span class="label">Current PB</span>' +

        '<span class="muted">' + esc(PB.formatDate(b.date)) + " · " + esc(PB.relativeDay(b.date)) + "</span>" +
        '<a class="link" href="#/activity/' + primary + '">See progress</a></div>');

    html.push('<p class="fine">' + esc(s.name) + " · " + (s.sub ? esc(s.sub) + " · " : "") +

  function wireForm(formId) {
    var f = PB.form(formId);
    var form = document.getElementById("entry-form");
    if (!f || !form) return;
    wireTimer(f);
    wireRest(f);

    function raw(metricId) {
      return readField(form, metricId);
    }

    function echo() {
      f.fields.forEach(function (fld) {
        var m = PB.metric(fld.metric);
        fld.hintless = f.sumTo && f.sumTo.from.indexOf(fld.metric) >= 0;
        var hint = form.querySelector('[data-hint="' + fld.metric + '"]');
        var text = raw(fld.metric);
        if (!hint) return;
        var base = fld.hintless ? "" : PB.UNITS[m.unit].hint;
        if (!text) { hint.textContent = base; hint.className = "hint"; return; }
        var v = PB.parseValue(m.unit, text);
        if (v == null) {
          hint.textContent = "Not a valid entry — " + PB.UNITS[m.unit].hint;
          hint.className = "hint bad";
        } else {
          /* Only speak up when the app read something other than what was
             typed — "8:42" needs no commentary, "522" does. */
          var shown = PB.formatValue(m.unit, v);
          hint.textContent = shown === text ? base : "Reads as " + PB.formatFull(m.unit, v);
          hint.className = shown === text ? "hint" : "hint good";
        }
      });

      if (f.derive) {
        var out = document.getElementById("derived-out");
        var total = PB.parseValue(PB.metric(f.derive.from).unit, raw(f.derive.from));
        out.textContent = total == null
          ? "Pace per 500m fills in automatically."
          : "Pace per 500m: " + PB.formatFull("pace", total / f.derive.divide);
      }

      if (f.sumTo) {
        var parts = f.sumTo.from.map(function (id) { return PB.parseValue("time", raw(id)); });
        var totalEl = form.querySelector('[name="' + f.sumTo.metric + '"]');
        if (parts.every(function (p) { return p != null; }) && totalEl && !totalEl.dataset.touched) {
          writeField(form, f.sumTo.metric, parts.reduce(function (a, b) { return a + b; }, 0), true);
          echoOne(f.sumTo.metric);
        }
      }
    }

    function echoOne(metricId) {
      var m = PB.metric(metricId);
      var hint = form.querySelector('[data-hint="' + metricId + '"]');
      var v = PB.parseValue(m.unit, raw(metricId));
      if (hint && v != null) {
        var shown = PB.formatValue(m.unit, v);
        var same = shown === raw(metricId);
        hint.textContent = same ? "" : "Reads as " + PB.formatFull(m.unit, v);
        hint.className = same ? "hint" : "hint good";
      }
    }

    form.addEventListener("input", function (e) {
      var baseName = String(e.target.name || "").replace(/__ss$/, "");
      if (f.sumTo && baseName === f.sumTo.metric && e.isTrusted) {
        var totalEl = form.querySelector('[name="' + f.sumTo.metric + '"]');
        if (totalEl) totalEl.dataset.touched = "1";
      }
      /* two digits of minutes hops the cursor to the seconds box */
      if (e.isTrusted && e.target.classList.contains("t-mm") && e.target.value.length >= 2) {
        var ssEl = form.querySelector('[name="' + e.target.name + '__ss"]');
        if (ssEl && !ssEl.value) ssEl.focus();
      }
      echo();
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("form-error");
      var values = {}, problem = null;

      f.fields.forEach(function (fld) {
        var m = PB.metric(fld.metric);
        var text = raw(fld.metric);
        if (!text) {
          if (fld.required) problem = problem || (fld.label + " is needed to save this entry.");
          return;
        }
        var v = PB.parseValue(m.unit, text);
        if (v == null) { problem = problem || (fld.label + " is not a value we can read. " + PB.UNITS[m.unit].hint + "."); return; }
        values[fld.metric] = v;
      });

      var date = form.querySelector('[name="date"]').value || PB.today();
      if (date > PB.today()) problem = problem || "That date is in the future.";

      if (problem) {
        err.textContent = problem;
        err.hidden = false;
        return;
      }
      err.hidden = true;

      if (f.derive && values[f.derive.from] != null) {
        values[f.derive.metric] = Math.round((values[f.derive.from] / f.derive.divide) * 10) / 10;
      }

      var note = form.querySelector('[name="note"]').value.trim();
      var res = PB.store.addSession(values, date, note);

      var scoredPrs = res.prs.filter(function (id) { return PB.metric(id).scored; });
      var msg = res.prs.length
        ? icon("trophy") + "<div><strong>New personal best</strong><span>" +
          esc(res.prs.map(function (id) { return PB.metric(id).short; }).join(" · ")) + "</span></div>"
        : "<div><strong>Entry saved</strong><span>" + esc(f.title) + " · " + esc(PB.formatDate(date)) + "</span></div>";
      toast(msg, res.prs.length ? "pb" : "");
      go("#/activity/" + f.fields[0].metric);
      void scoredPrs;
    });

    echo();
  }
