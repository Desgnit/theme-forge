<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client PB Tracker</title>
<meta name="description" content="Log your times, watts and lifts, see every personal best, medal your top three efforts and score your overall fitness. Works offline on your phone.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PB Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<a class="skip" href="#view">Skip to content</a>

<header class="app-head">
  <div class="head-inner">
    <div class="head-titles">
      <span class="head-kicker">Measure / Improve / Ascend</span>
      <strong class="head-name" id="header-name">Client PB Tracker</strong>
    </div>
    <a class="head-score" href="#/score" aria-label="Overall fitness score">
      <strong id="header-score">—</strong><span>score</span>
    </a>
    <a class="head-gear" href="#/data" aria-label="Data and backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/></svg>
    </a>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Main">
  <a class="tab" data-tab="log" href="#/log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Log</span>
  </a>
  <a class="tab" data-tab="pbs" href="#/pbs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M10 18h4M9 21h6"/></svg><span>PBs</span>
  </a>
  <a class="tab" data-tab="score" href="#/score">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Score</span>
  </a>
  <a class="tab" data-tab="history" href="#/history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>History</span>
  </a>
</nav>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/score.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/chart.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
